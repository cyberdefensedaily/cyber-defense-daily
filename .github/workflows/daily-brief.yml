name: Daily Cyber Brief

on:
  schedule:
    # Runs at 12:00 UTC daily (~8am ET / 5am PT). Adjust the hour to taste --
    # cron is UTC regardless of your local time zone.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_daily_brief.py

      - name: Get today's date
        id: date
        run: echo "today=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Open a Pull Request for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Daily brief: ${{ steps.date.outputs.today }}"
          title: "🤖 Daily Brief — ${{ steps.date.outputs.today }}"
          body: |
            Auto-generated by the daily brief workflow. **Nothing is live yet.**

            Review the new file(s) under `daily/`, edit anything directly in this PR
            if needed, then merge to publish. Closing this PR without merging
            discards today's brief.
          branch: "daily-brief/${{ steps.date.outputs.today }}"
          delete-branch: true
          labels: |
            ai-generated
            needs-review
